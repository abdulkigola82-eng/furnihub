<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ongeza Bidhaa | FurniHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0e6;
            color: #222;
            margin: 0;
            padding: 20px 12px;
        }
        .card {
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 18px #0001;
        }
        h1 { color: #9a742c; }
        label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
        }
        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #9a742c;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        a { color: #80601e; }
        .errorlist { color: #b00020; }
        .messages { padding: 10px; background: #fff3cd; }
    </style>
</head>
<body>
<div class="card">
    <h1>Ongeza Bidhaa</h1>
    <p>Karibu, {{ seller.business_name }}. Jaza taarifa za samani yako.</p>

    {% if messages %}
        {% for message in messages %}
            <p class="messages">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Hifadhi Bidhaa</button>
    </form>

    <p><a href="{% url 'seller_dashboard' %}">Rudi kwenye dashboard</a></p>
</div>
</body>
</html>
