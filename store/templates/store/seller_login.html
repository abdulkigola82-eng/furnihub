<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kuingia | FurniHub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f0e6; margin: 0; padding: 24px 14px; color: #222; }
        .card { max-width: 440px; margin: 30px auto; background: white; padding: 24px; border-radius: 14px; box-shadow: 0 4px 18px #0001; }
        h1 { color: #9a742c; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 7px; }
        button { width: 100%; padding: 13px; margin-top: 22px; border: 0; border-radius: 7px; background: #9a742c; color: white; font-weight: bold; font-size: 16px; }
        .errorlist { color: #b00020; }
        a { color: #80601e; }
    </style>
</head>
<body>
<div class="card">
    <h1>Ingia FurniHub</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        {% endfor %}

        <button type="submit">Ingia</button>
    </form>

    <p>Huna akaunti? <a href="{% url 'seller_register' %}">Jisajili kama muuzaji</a></p>
    <p><a href="{% url 'home' %}">Rudi FurniHub</a></p>
</div>
</body>
</html>
